[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
rust-version = "1.90"

[workspace.dependencies]
pocket-engine = { path = "crates/pocket-engine" }
# deckgym と同じ系列に揃える（混在すると RNG の再現性が崩れる）
rand = "0.8"
rayon = "1"
# CardId の列挙に使う。deckgym と同じ版に揃える
strum = "0.27"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
pyo3 = { version = "0.29", features = ["extension-module"] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# シミュレータでは数値変換が頻出するため、過剰に厳しいものは緩める
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
must_use_candidate = "allow"
module_name_repetitions = "allow"

[profile.release]
lto = "thin"
codegen-units = 1

# シミュレーションのベンチ・大量対戦用（デバッグ情報付きの最適化ビルド）
[profile.profiling]
inherits = "release"
debug = true
